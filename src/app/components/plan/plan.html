<div id="plan">
<app-general-content
    [title]="'<span class=highlight-tes>UX Research Study Method</span>'"
    [bodyOne]="'<div class=gen-card><span class=highlight-tes>Step One: Plan</span><br />Planning is the foundation of the UX Research Study. Good planning allows for the best and most consistent feedback which will, eventually, allow for the most complete version of the app to be designed that will serve the most users.</div><div class=gen-card><span class=highlight-tes>Step Two: Research</span><br />In this step the research is actually conducted. It can be done in many ways but the two main categories are moderated and unmoderated. Moderated research happens in person and provides researchers a chance to build rapport with the users and walk them through the research process more personally Unmoderated research allows users to do the testing at their own pace and can encourage more honest and straightforward feedback.</div><div class=gen-card><span class=highlight-tes>Step Three: Synthesize</span><br />Once you have gathered your data, you need to analyze it to understand the feedback you have received and how it applies to your design. One way to organize this information is with an affinity diagram, which is a method using sticky notes where each notes lists a different idea and is color coded to the user. These notes can these be organized into groups where they apply to the design.</div><div class=gen-card><span class=highlight-tes>Step Four: Share</span><br />Once the data has been gathered and analyzed, it will need to be compiled into a presentation to share with shareholders and team members to make the data more digestible. A very effective way to organize that information is a tool like Google Slides or Microsoft PowerPoint.</div>'"
    [imgSrc]="'/study.png'"
    [flexDirection]="'flexcolumn'"
>
</app-general-content>
</div>
